# Host network: probes must see the server uplink, not the docker bridge.
name: netscan

services:
  netscan:
    image: ${NETSCAN_IMAGE}
    pull_policy: always
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_RAW
    mem_limit: 128m
    cpus: "0.25"
    env_file:
      - .env.hub
    volumes:
      - netscan_data:/data

volumes:
  netscan_data:
